<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大專屬刮刮樂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --boss-gold: #ffd700;
            --boss-red: #ff2200;
            --boss-dark: #0d0202;
        }

        * { font-family: 'Noto Sans TC', sans-serif; }

        body { 
            background: #050000;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* 霸氣地獄紅光與暗黑網格背景 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 40%, rgba(180, 0, 0, 0.35) 0%, rgba(5,0,0,0.95) 75%),
                linear-gradient(rgba(255, 215, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            z-index: -2;
        }

        .bull-aura {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 34, 0, 0.25) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            animation: pulseAura 2.5s infinite alternate ease-in-out;
        }

        @keyframes pulseAura {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .boss-card { 
            width: 90%; 
            max-width: 440px; 
            padding: 35px 25px; 
            border-radius: 20px; 
            background: rgba(18, 4, 4, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid var(--boss-gold);
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.4),
                inset 0 0 20px rgba(255, 34, 0, 0.3);
            text-align: center; 
            position: relative;
            z-index: 1;
        }

        /* 原生 SVG 牛頭勳章 */
        .bull-badge {
            width: 85px;
            height: 85px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: radial-gradient(circle, #3a0000 0%, #100000 100%);
            border: 2px solid var(--boss-gold);
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.8), inset 0 0 10px rgba(255, 34, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bull-badge svg {
            width: 52px;
            height: 52px;
            fill: var(--boss-gold);
            filter: drop-shadow(0px 0px 6px rgba(255, 34, 0, 0.9));
        }

        .boss-title {
            color: var(--boss-gold);
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 0 10px var(--boss-gold), 0 0 20px var(--boss-red);
            letter-spacing: 2px;
        }

        .boss-input {
            background: rgba(0, 0, 0, 0.85) !important;
            border: 1.5px solid var(--boss-gold) !important;
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .boss-input::placeholder {
            color: rgba(255, 215, 0, 0.5) !important;
            font-size: 14px;
        }

        .btn-boss {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border: none;
            color: #2b0000;
            font-weight: 900;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transition: all 0.3s ease;
        }

        .btn-boss:hover {
            background: linear-gradient(135deg, #ffffff, #ffd700);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
            transform: translateY(-2px);
        }

        .scratch-container { 
            position: relative; 
            width: 300px; 
            height: 150px; 
            margin: 20px auto; 
            display: none; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid var(--boss-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }

        .prize-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #5e0000 0%, #1a0000 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            color: var(--boss-gold); 
            text-shadow: 0 0 12px var(--boss-gold);
        }

        canvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: crosshair; 
            transition: opacity 0.5s ease; 
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bull-aura"></div>

<div class="boss-card">
    <!-- 純 SVG 金屬牛頭圖騰，不需載入圖床 -->
    <div class="bull-badge">
        <svg viewBox="0 0 24 24">
            <path d="M12,2 C12,2 14,5 17,5 C20,5 22,2 22,2 C22,7 19,10 18,12 C19,14 20,16 19,18 C18,20 15,22 12,22 C9,22 6,20 5,18 C4,16 5,14 6,12 C5,10 2,7 2,2 C2,2 4,5 7,5 C10,5 12,2 12,2 Z M12,7 C10,7 8.5,8.5 8.5,10 C8.5,11.5 10,13 12,13 C14,13 15.5,11.5 15.5,10 C15.5,8.5 14,7 12,7 Z" />
        </svg>
    </div>

    <h3 class="boss-title mb-3">牛老大專屬刮刮樂</h3>
    
    <div id="loginForm">
        <p class="text-warning small mb-3">請輸入專屬兌換金鑰以領取尊榮獎項：</p>
        
        <input type="text" id="keyInput" class="form-control boss-input mb-3 text-center fw-bold py-2" placeholder="請輸入專屬金鑰">
        
        <button class="btn btn-boss w-100 py-2.5 rounded-pill" id="loginBtn" onclick="handleLogin()">兌 換 尊 榮 好 禮</button>
    </div>

    <div id="scratchSection">
        <div class="scratch-container" id="scratchContainer">
            <div class="prize-layer">
                <div style="color: #ffaa00; font-size: 13px; letter-spacing: 2px;">❖ 恭喜獲得獎項 ❖</div>
                <div id="prizeResult" style="font-size: 28px; margin-top: 5px;"></div>
            </div>
            <canvas id="scratchCanvas" width="300" height="150"></canvas>
        </div>
        <p id="scratchHint" class="text-warning small mt-2 fw-bold" style="display: none;">✨ 請滑動刮開金屬塗層 ✨</p>
    </div>
</div>

<script>
    const JSONBIN_API_KEY = "$2a$10$92XGHP.lNCPqYGVXwVe1OO1/L4jOoI01kKN4TNQwrALhIOuj8tWwy";
    const JSONBIN_BIN_ID = "6a89842df5f4af5e2934e74f";

    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            const data = await res.json();
            return (data && typeof data === 'object') ? data : {};
        } catch (e) {
            console.error("雲端載入失敗:", e);
            return {};
        }
    }

    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("雲端同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();
        if (!inputKey) return alert('請輸入金鑰！');

        const btn = document.getElementById('loginBtn');
        btn.innerText = "驗證金鑰中...";
        btn.disabled = true;

        const db = await loadDB();
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "兌 換 尊 榮 好 禮";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];
        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    let ctx, isDrawing = false, count = 0;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        const grad = ctx.createLinearGradient(0, 0, 300, 150);
        grad.addColorStop(0, '#b8860b');
        grad.addColorStop(0.5, '#7f0000');
        grad.addColorStop(1, '#ffd700');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 300, 150);
        
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.strokeRect(5, 5, 290, 140);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 8;
        ctx.fillText('✨ 滑動刮開金屬圖層 ✨', 150, 80);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 30) canvas.style.opacity = '0';
        };
    }
</script>
</body>
</html>
