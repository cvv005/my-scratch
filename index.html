<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大專屬刮刮樂 - VIP尊榮限定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Confetti 特效套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold-light: #fff3a1;
            --gold-main: #e0aa3e;
            --gold-dark: #8c5d0a;
            --bg-dark: #06040a;
        }

        * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }

        body { 
            background: var(--bg-dark);
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* 滿版星空 Canvas */
        #bgCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 頂部即時獲獎跑馬燈 (增加熱烈氛圍) */
        .live-ticker {
            position: absolute;
            top: 25px;
            z-index: 10;
            background: rgba(224, 170, 62, 0.12);
            border: 1px solid rgba(224, 170, 62, 0.3);
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 12px;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: fadeInDown 1s ease-out;
        }

        .ticker-dot {
            width: 8px; height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: blink 1.5s infinite alternate;
        }

        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 卡片外框（動態流光邊框） */
        .card-wrapper {
            position: relative;
            width: 90%;
            max-width: 440px;
            border-radius: 28px;
            padding: 2px;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(224, 170, 62, 0.22),
                0 30px 80px rgba(0, 0, 0, 0.95);
            z-index: 1;
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(
                transparent, 
                rgba(255, 243, 161, 0.3), 
                var(--gold-main), 
                transparent 45%
            );
            animation: rotateStreamer 7s linear infinite;
        }

        @keyframes rotateStreamer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 主體黑金卡片 */
        .card-inner {
            position: relative;
            background: linear-gradient(155deg, #1d142b 0%, #0c0716 100%);
            border-radius: 26px;
            padding: 45px 32px 40px;
            text-align: center;
            z-index: 2;
        }

        /* 奢華雕花四角裝飾 */
        .corner-pattern {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--gold-main);
            opacity: 0.6;
            pointer-events: none;
        }
        .corner-tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
        .corner-tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
        .corner-br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

        /* VIP 限定尊榮標籤 */
        .vip-tag {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--gold-main);
            border: 1px solid rgba(224, 170, 62, 0.4);
            border-radius: 20px;
            padding: 3px 14px;
            display: inline-block;
            margin-bottom: 18px;
            background: rgba(224, 170, 62, 0.08);
            box-shadow: inset 0 0 10px rgba(224, 170, 62, 0.2);
        }

        /* 霸氣金牛雙角徽章 */
        .badge-wrap {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-glow {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(224, 170, 62, 0.5) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 0.9; }
        }

        .badge-body {
            position: relative;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2e210b 0%, #070401 100%);
            border: 2px solid var(--gold-main);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 0 15px rgba(224, 170, 62, 0.5),
                0 8px 25px rgba(0,0,0,0.8);
        }

        .badge-body i {
            font-size: 38px;
            background: linear-gradient(180deg, #FFF3A1 0%, #E0AA3E 60%, #8C5D0A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.9));
        }

        /* 標題與內文 */
        .title {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, #ffe899 40%, var(--gold-main) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.6);
        }

        .subtitle {
            color: #8c859d;
            font-size: 12.5px;
            letter-spacing: 1px;
            margin-bottom: 26px;
        }

        /* 金屬質感輸入框 */
        .custom-input {
            background: rgba(6, 4, 10, 0.75) !important;
            border: 1px solid rgba(224, 170, 62, 0.35) !important;
            color: var(--gold-light) !important;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--gold-main) !important;
            box-shadow: 0 0 20px rgba(224, 170, 62, 0.4) !important;
            outline: none;
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.25) !important;
            font-weight: 400;
            font-size: 13.5px;
        }

        /* 耀金按鈕（光芒掃過特效） */
        .btn-gold {
            position: relative;
            background: linear-gradient(180deg, #ffe066 0%, #e0aa3e 50%, #b37e14 100%);
            border: none;
            color: #140b00;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 2px;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(224, 170, 62, 0.35);
            transition: all 0.25s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .btn-gold::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 50%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -60%; }
            30% { left: 140%; }
            100% { left: 140%; }
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(224, 170, 62, 0.55);
        }

        /* 刮刮卡區域 */
        .scratch-container { 
            position: relative; 
            width: 300px; 
            height: 150px; 
            margin: 15px auto 0; 
            display: none; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 2px solid var(--gold-main);
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
        }

        .prize-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #2e1a3d 0%, #0a0512 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        canvas#scratchCanvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: crosshair; 
            transition: opacity 0.6s ease; 
        }

        /* 底部註腳文字 */
        .footer-note {
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
</head>
<body>

<!-- 動態星空與亮點粒子 Canvas -->
<canvas id="bgCanvas"></canvas>

<!-- 頂部即時廣播跑馬燈 -->
<div class="live-ticker">
    <div class="ticker-dot"></div>
    <span id="tickerMsg">VIP 貴賓 ***9 號 剛剛刮中了 豪華獎項！</span>
</div>

<!-- 主卡片區域 -->
<div class="card-wrapper">
    <div class="card-inner">
        <!-- 雕花四角裝飾 -->
        <div class="corner-pattern corner-tl"></div>
        <div class="corner-pattern corner-tr"></div>
        <div class="corner-pattern corner-bl"></div>
        <div class="corner-pattern corner-br"></div>

        <!-- VIP 標籤 -->
        <div class="vip-tag">VIP LIMITED EDITION</div>

        <!-- 金牛頭徽章 -->
        <div class="badge-wrap">
            <div class="badge-glow"></div>
            <div class="badge-body">
                <i class="fa-solid fa-crown"></i>
            </div>
        </div>

        <div class="title">牛老大專屬刮刮樂</div>
        <div class="subtitle">請輸入專屬金鑰以兌換尊榮禮遇</div>

        <!-- 輸入表單 -->
        <div id="loginForm">
            <input type="text" id="keyInput" class="form-control custom-input mb-3 text-center" placeholder="請輸入兌換金鑰">
            <button class="btn btn-gold w-100" id="loginBtn" onclick="handleLogin()">兌 換 尊 榮 好 禮</button>
        </div>

        <!-- 刮刮樂區塊 -->
        <div id="scratchSection">
            <div class="scratch-container" id="scratchContainer">
                <div class="prize-layer">
                    <i class="fa-solid fa-gem mb-1" style="color: var(--gold-light); font-size: 28px; filter: drop-shadow(0 2px 10px rgba(224,170,62,0.8));"></i>
                    <div style="color: #8c859d; font-size: 11px; letter-spacing: 2px;">❖ 恭喜獲得尊榮獎項 ❖</div>
                    <div id="prizeResult" style="font-size: 24px; font-weight: 900; margin-top: 4px; color: var(--gold-light);"></div>
                </div>
                <canvas id="scratchCanvas" width="300" height="150"></canvas>
            </div>
            <p id="scratchHint" style="display: none; color: var(--gold-light); font-size: 13px; margin-top: 14px; font-weight: bold; letter-spacing: 1px;">
                ✨ 請滑動刮開金色塗層 ✨
            </p>
        </div>
    </div>
</div>

<div class="footer-note">❖ 牛老大 VIP 尊榮邀請禮遇 ❖</div>

<script>
    // 1. 動態星空與閃爍粒子背景
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];

    function resizeBg() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    for(let i=0; i<80; i++) {
        particles.push({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            r: Math.random() * 2 + 0.5,
            alpha: Math.random(),
            speed: Math.random() * 0.3 + 0.1,
            twinkleSpeed: Math.random() * 0.03 + 0.01
        });
    }

    function drawBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        particles.forEach(p => {
            p.alpha += p.twinkleSpeed;
            if (p.alpha > 1 || p.alpha < 0) p.twinkleSpeed = -p.twinkleSpeed;

            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            bgCtx.fillStyle = `rgba(224, 170, 62, ${Math.abs(p.alpha)})`;
            bgCtx.fill();

            p.y -= p.speed;
            if(p.y < 0) p.y = bgCanvas.height;
        });
        requestAnimationFrame(drawBg);
    }
    drawBg();

    // 2. 跑馬燈動態隨機切換
    const mockWinners = [
        "VIP 貴賓 8***6 剛剛刮中了 特等獎！",
        "VIP 貴賓 3***9 剛剛刮中了 尊榮好禮！",
        "VIP 貴賓 5***1 剛剛刮中了 專屬禮券！",
        "VIP 貴賓 1***8 剛剛刮中了 幸運大獎！"
    ];
    let tickerIdx = 0;
    setInterval(() => {
        tickerIdx = (tickerIdx + 1) % mockWinners.length;
        document.getElementById('tickerMsg').innerText = mockWinners[tickerIdx];
    }, 4000);

    // 3. 業務 API 邏輯
    const JSONBIN_API_KEY = "$2a$10$92XGHP.lNCPqYGVXwVe1OO1/L4jOoI01kKN4TNQwrALhIOuj8tWwy";
    const JSONBIN_BIN_ID = "6a89842df5f4af5e2934e74f";

    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            return await res.json() || {};
        } catch (e) {
            console.error("載入失敗:", e);
            return {};
        }
    }

    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();
        if (!inputKey) return alert('請輸入金鑰！');

        const btn = document.getElementById('loginBtn');
        btn.innerText = "尊榮金鑰驗證中...";
        btn.disabled = true;

        const db = await loadDB();
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "兌 換 尊 榮 好 禮";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];
        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    // 4. 刮刮卡 + 金色慶祝噴發特效
    let ctx, isDrawing = false, count = 0, isTriggeredConfetti = false;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        // 金屬沙金塗層
        const grad = ctx.createLinearGradient(0, 0, 300, 150);
        grad.addColorStop(0, '#e0aa3e');
        grad.addColorStop(0.3, '#fff3a1');
        grad.addColorStop(0.7, '#9e6d0f');
        grad.addColorStop(1, '#ffe066');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 300, 150);

        // 閃粉顆粒壓紋
        for(let i=0; i<150; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
            ctx.fillRect(Math.random()*300, Math.random()*150, 2, 2);
        }
        
        ctx.fillStyle = '#140b00';
        ctx.font = 'bold 16px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.fillText('❖ 刮開圖層 領取好禮 ❖', 150, 82);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 20 && !isTriggeredConfetti) {
                isTriggeredConfetti = true;
                canvas.style.opacity = '0';
                
                // 觸發金色禮花噴發
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ffe066', '#e0aa3e', '#ffffff']
                });
            }
        };
    }
</script>
</body>
</html>
