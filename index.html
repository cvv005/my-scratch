<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大專屬刮刮樂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-1: #FFE58F;
            --gold-2: #FAAD14;
            --gold-3: #D48806;
            --gold-dark: #8C5400;
            --bg-dark: #0A0812;
        }

        * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }

        body { 
            background-color: var(--bg-dark);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* 暗黑奢華背景光暈 */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(250, 173, 20, 0.12) 0%, rgba(212, 136, 6, 0.03) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* 流光黑金卡片容器 */
        .card-wrapper {
            position: relative;
            width: 90%;
            max-width: 400px;
            padding: 2px; /* 留給漸層邊框 */
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(250, 173, 20, 0.6), rgba(255, 255, 255, 0.05), rgba(212, 136, 6, 0.4));
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(250, 173, 20, 0.15);
            z-index: 1;
        }

        .card-inner {
            background: linear-gradient(180deg, #161224 0%, #0d0a17 100%);
            border-radius: 22px;
            padding: 40px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 頂級鍍金標誌 */
        .brand-logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a203d 0%, #120d1e 100%);
            border: 1px solid rgba(250, 173, 20, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .brand-logo i {
            font-size: 34px;
            background: linear-gradient(135deg, #FFF6D6 0%, #FAAD14 50%, #8C5400 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        /* 標題設計 */
        .main-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #FFFFFF 0%, #FFE58F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .sub-title {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 32px;
        }

        /* 高級輸入框 */
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .custom-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(250, 173, 20, 0.25) !important;
            color: #FFE58F !important;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.2) !important;
            font-weight: 400;
            letter-spacing: 0px;
            font-size: 14px;
        }

        .custom-input:focus {
            border-color: var(--gold-2) !important;
            box-shadow: 0 0 15px rgba(250, 173, 20, 0.3) !important;
        }

        /* 奢華曜金按鈕 */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #FFE58F 0%, #FAAD14 50%, #D48806 100%);
            border: none;
            color: #120A00;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 2px;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(250, 173, 20, 0.35);
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(250, 173, 20, 0.5);
            background: linear-gradient(135deg, #FFF0B3 0%, #FFC53D 50%, #E89E00 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* 刮刮卡區塊 */
        .scratch-box { 
            position: relative; 
            width: 280px; 
            height: 140px; 
            margin: 10px auto 0; 
            display: none; 
            border-radius: 14px; 
            overflow: hidden; 
            border: 1px solid rgba(250, 173, 20, 0.6);
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .prize-display { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #231935 0%, #0d0817 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
        }

        canvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: pointer; 
            transition: opacity 0.6s ease; 
        }
    </style>
</head>
<body>

<div class="ambient-glow"></div>

<div class="card-wrapper">
    <div class="card-inner">
        <!-- 皇冠盾牌圖標 -->
        <div class="brand-logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="main-title">牛老大專屬刮刮樂</div>
        <div class="sub-title">請輸入金鑰以兌換您的尊榮禮遇</div>
        
        <div id="loginForm">
            <div class="input-group-custom">
                <input type="text" id="keyInput" class="custom-input" placeholder="輸入兌換金鑰" autocomplete="off">
            </div>
            <button class="btn-submit" id="loginBtn" onclick="handleLogin()">兌 換 尊 榮 獎 項</button>
        </div>

        <div id="scratchSection">
            <div class="scratch-box" id="scratchContainer">
                <div class="prize-display">
                    <i class="fa-solid fa-gift mb-2" style="color: var(--gold-2); font-size: 22px;"></i>
                    <div style="color: rgba(255, 255, 255, 0.5); font-size: 11px; letter-spacing: 2px;">恭喜獲得尊榮好禮</div>
                    <div id="prizeResult" style="font-size: 22px; margin-top: 4px; color: #FFE58F;"></div>
                </div>
                <canvas id="scratchCanvas" width="280" height="140"></canvas>
            </div>
            <div id="scratchHint" style="display:none; color: var(--gold-1); font-size: 12px; margin-top: 12px; font-weight: bold; letter-spacing: 1px;">
                <i class="fa-solid fa-hand-pointer me-1"></i> 請滑動刮開塗層
            </div>
        </div>
    </div>
</div>

<script>
    const JSONBIN_API_KEY = "$2a$10$92XGHP.lNCPqYGVXwVe1OO1/L4jOoI01kKN4TNQwrALhIOuj8tWwy";
    const JSONBIN_BIN_ID = "6a89842df5f4af5e2934e74f";

    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            const data = await res.json();
            return (data && typeof data === 'object') ? data : {};
        } catch (e) {
            console.error("載入失敗:", e);
            return {};
        }
    }

    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();
        if (!inputKey) return alert('請輸入金鑰！');

        const btn = document.getElementById('loginBtn');
        btn.innerText = "安全驗證中...";
        btn.disabled = true;

        const db = await loadDB();
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "兌 換 尊 榮 獎 項";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];
        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    let ctx, isDrawing = false, count = 0;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        // 金屬壓紋塗層
        const grad = ctx.createLinearGradient(0, 0, 280, 140);
        grad.addColorStop(0, '#FAAD14');
        grad.addColorStop(0.5, '#8C5400');
        grad.addColorStop(1, '#FFE58F');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 280, 140);
        
        ctx.fillStyle = '#120A00';
        ctx.font = 'bold 14px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.fillText('刮開圖層 領取好禮', 140, 75);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 25) canvas.style.opacity = '0';
        };
    }
</script>
</body>
</html>
