<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>牛老大專屬刮刮樂 - VIP尊榮限定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold-light: #fff5ba;
            --gold-main: #d4af37;
            --gold-bright: #ffe680;
            --gold-dark: #aa7c11;
            --gold-shadow: #593e03;
        }

        * { font-family: 'Noto Serif TC', serif; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05020a;
        }

        body { 
            background: 
                radial-gradient(circle at 50% 35%, rgba(212, 175, 55, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(38, 16, 56, 0.9) 0%, #030106 100%);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            color: #ffffff;
            position: relative;
        }

        /* 奢華鑽石壓紋圖騰背景 */
        .bg-pattern {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(rgba(212, 175, 55, 0.12) 1px, transparent 0),
                linear-gradient(135deg, rgba(212, 175, 55, 0.03) 25%, transparent 25%, transparent 75%, rgba(212, 175, 55, 0.03) 75%),
                linear-gradient(45deg, rgba(212, 175, 55, 0.03) 25%, transparent 25%, transparent 75%, rgba(212, 175, 55, 0.03) 75%);
            background-size: 30px 30px, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        #bgCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 頂部鍍金跑馬燈 */
        .live-ticker {
            position: absolute;
            top: 22px;
            z-index: 10;
            background: linear-gradient(180deg, rgba(25, 12, 38, 0.9) 0%, rgba(10, 4, 18, 0.95) 100%);
            border: 1px solid transparent;
            border-image: linear-gradient(90deg, transparent, var(--gold-main), transparent) 1;
            border-radius: 50px;
            padding: 8px 26px;
            font-size: 13px;
            font-weight: 600;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .ticker-dot {
            width: 8px; height: 8px;
            background: var(--gold-bright);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold-bright);
            animation: blink 1.2s infinite alternate;
        }

        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 高質感奢華卡片容器（立體金屬重框） */
        .card-wrapper {
            position: relative;
            width: 380px;
            height: 620px;
            border-radius: 24px;
            padding: 8px;
            background: linear-gradient(135deg, #d4af37 0%, #593e03 30%, #ffeea1 50%, #8a640f 70%, #d4af37 100%);
            box-shadow: 
                0 0 50px rgba(212, 175, 55, 0.25),
                0 30px 80px rgba(0, 0, 0, 0.95),
                inset 0 0 10px rgba(0,0,0,0.8);
            z-index: 1;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 20%, #221235 0%, #0d0517 80%);
            border-radius: 18px;
            padding: 24px 20px 20px;
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
        }

        /* 雕花金屬角邊 */
        .corner-emboss {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            opacity: 0.75;
        }
        .corner-tl { top: 8px; left: 8px; border-top: 2px solid var(--gold-main); border-left: 2px solid var(--gold-main); }
        .corner-tr { top: 8px; right: 8px; border-top: 2px solid var(--gold-main); border-right: 2px solid var(--gold-main); }
        .corner-bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--gold-main); border-left: 2px solid var(--gold-main); }
        .corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--gold-main); border-right: 2px solid var(--gold-main); }

        .vip-tag {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--gold-light);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: linear-gradient(180deg, #422906 0%, #170d01 100%);
            border: 1px solid var(--gold-main);
            border-radius: 4px;
            padding: 4px 16px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.3);
        }

        /* 牛老大霸氣標誌立體壓印徽章 */
        .badge-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 10px auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-glow {
            position: absolute;
            width: 120%; height: 120%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.6) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.25); opacity: 0.9; }
        }

        .badge-body {
            position: relative;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, #382005 0%, #0a0400 100%);
            border: 2px solid var(--gold-bright);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.95),
                inset 0 0 18px rgba(212, 175, 55, 0.8);
        }

        /* 主標題視覺 */
        .title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 0%, #fff2ad 30%, #d4af37 70%, #8a6109 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.9));
        }

        .subtitle {
            color: #a395b8;
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* 上方分割飾條 */
        .divider-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 12px 0;
            opacity: 0.85;
        }

        .divider-line {
            height: 1px;
            flex: 1;
            background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
        }

        /* 奢華高光輸入框 */
        .form-area {
            width: 100%;
        }

        .custom-input {
            background: rgba(8, 3, 13, 0.9) !important;
            border: 1px solid var(--gold-dark) !important;
            color: var(--gold-bright) !important;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 2px;
            border-radius: 10px;
            padding: 12px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.9);
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--gold-bright) !important;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 2px 6px rgba(0,0,0,0.9) !important;
            outline: none;
        }

        .custom-input::placeholder {
            color: rgba(212, 175, 55, 0.35) !important;
            font-size: 12px;
            font-weight: 400;
        }

        /* 鍍金立體按鈕 */
        .btn-gold {
            position: relative;
            background: linear-gradient(180deg, #fff3b3 0%, #d4af37 40%, #996c06 100%);
            border: 1px solid var(--gold-bright);
            color: #120900;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 3px;
            border-radius: 10px;
            padding: 13px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255,255,255,0.8);
            transition: all 0.25s ease;
            cursor: pointer;
            overflow: hidden;
            margin-top: 10px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        .btn-gold::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 40%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            transform: rotate(25deg);
            animation: shimmer 3.5s infinite;
        }

        @keyframes shimmer {
            0% { left: -60%; }
            30% { left: 140%; }
            100% { left: 140%; }
        }

        /* 下方典藏勳章區 */
        .bottom-card {
            width: 100%;
            background: linear-gradient(180deg, rgba(20, 10, 30, 0.6) 0%, rgba(8, 3, 13, 0.9) 100%);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .badge-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .badge-item i {
            color: var(--gold-bright);
            font-size: 15px;
            filter: drop-shadow(0 2px 4px rgba(212,175,55,0.5));
        }

        .badge-item span {
            font-size: 11px;
            color: #c0b3d6;
            font-weight: 600;
        }

        .badge-sep {
            width: 1px;
            height: 20px;
            background: rgba(212, 175, 55, 0.2);
        }

        /* 刮刮樂區域 */
        .scratch-container { 
            position: relative; 
            width: 280px; 
            height: 140px; 
            margin: 5px auto 0; 
            display: none; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid var(--gold-main);
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .prize-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #33194a 0%, #0a0412 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        canvas#scratchCanvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: crosshair; 
            transition: opacity 0.6s ease; 
        }

        .footer-note {
            position: absolute;
            bottom: 16px;
            font-size: 11px;
            color: rgba(212, 175, 55, 0.4);
            letter-spacing: 3px;
            z-index: 10;
        }
    </style>
</head>
<body>

<!-- 背景幾何圖騰 -->
<div class="bg-pattern"></div>

<!-- 動態星芒 Canvas -->
<canvas id="bgCanvas"></canvas>

<!-- 頂部跑馬燈 -->
<div class="live-ticker">
    <div class="ticker-dot"></div>
    <span id="tickerMsg">VIP 貴賓 ***9 號 剛剛刮中了 豪華獎項！</span>
</div>

<!-- 黑金奢華主卡片 -->
<div class="card-wrapper">
    <div class="card-inner">
        <div class="corner-emboss corner-tl"></div>
        <div class="corner-emboss corner-tr"></div>
        <div class="corner-emboss corner-bl"></div>
        <div class="corner-emboss corner-br"></div>

        <!-- 頂部標題區 -->
        <div style="width: 100%;">
            <div class="vip-tag">VIP EXCLUSIVE</div>

            <!-- 霸氣黑金王者徽章 -->
            <div class="badge-wrap">
                <div class="badge-glow"></div>
                <div class="badge-body">
                    <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-crown" style="position: absolute; top: -14px; color: #ffe680; font-size: 16px; filter: drop-shadow(0 2px 6px #d4af37);"></i>
                        <i class="fa-solid fa-shield-halved" style="font-size: 44px; background: linear-gradient(180deg, #ffffff 0%, #ffe680 40%, #d4af37 80%, #593e03 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.9));"></i>
                        <i class="fa-solid fa-shield-cat" style="position: absolute; font-size: 24px; color: #120900; top: 12px; filter: drop-shadow(0 1px 2px rgba(255,255,255,0.3));"></i>
                    </div>
                </div>
            </div>

            <div>
                <div class="title">牛老大專屬刮刮樂</div>
                <div class="subtitle">請輸入專屬金鑰以兌換尊榮禮遇</div>
            </div>

            <div class="divider-bar">
                <div class="divider-line"></div>
                <i class="fa-solid fa-gem" style="color: var(--gold-main); font-size: 10px;"></i>
                <div class="divider-line"></div>
            </div>
        </div>

        <!-- 金鑰輸入表單 -->
        <div class="form-area" id="loginForm">
            <input type="text" id="keyInput" class="form-control custom-input text-center" placeholder="請輸入兌換金鑰">
            <button class="btn btn-gold w-100" id="loginBtn" onclick="handleLogin()">兌 換 尊 榮 好 禮</button>
        </div>

        <!-- 底部特色勳章 -->
        <div class="bottom-card" id="bottomCard">
            <div class="badge-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span>100% 中獎</span>
            </div>
            <div class="badge-sep"></div>
            <div class="badge-item">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>即刻解鎖</span>
            </div>
            <div class="badge-sep"></div>
            <div class="badge-item">
                <i class="fa-solid fa-award"></i>
                <span>VIP 權益</span>
            </div>
        </div>

        <!-- 刮刮樂區域 -->
        <div id="scratchSection" style="margin-bottom: 5px;">
            <div class="scratch-container" id="scratchContainer">
                <div class="prize-layer">
                    <i class="fa-solid fa-gem mb-1" style="color: var(--gold-bright); font-size: 26px; filter: drop-shadow(0 2px 10px rgba(212,175,55,0.8));"></i>
                    <div style="color: #a395b8; font-size: 11px; letter-spacing: 2px;">❖ 恭喜獲得尊榮獎項 ❖</div>
                    <div id="prizeResult" style="font-size: 22px; font-weight: 900; margin-top: 4px; color: var(--gold-light);"></div>
                </div>
                <canvas id="scratchCanvas" width="280" height="140"></canvas>
            </div>
            <p id="scratchHint" style="display: none; color: var(--gold-light); font-size: 12px; margin-top: 10px; font-weight: bold; letter-spacing: 1px;">
                ✨ 請滑動刮開金色塗層 ✨
            </p>
        </div>

    </div>
</div>

<div class="footer-note">❖ 牛老大 VIP 尊榮邀請禮遇 ❖</div>

<script>
    // 星芒繪製
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];

    function resizeBg() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    for(let i=0; i<60; i++) {
        particles.push({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            size: Math.random() * 2.5 + 1,
            alpha: Math.random(),
            speed: Math.random() * 0.15 + 0.05,
            twinkleSpeed: Math.random() * 0.02 + 0.005
        });
    }

    function drawBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        particles.forEach(p => {
            p.alpha += p.twinkleSpeed;
            if (p.alpha > 1 || p.alpha < 0) p.twinkleSpeed = -p.twinkleSpeed;

            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI*2);
            bgCtx.fillStyle = `rgba(212, 175, 55, ${Math.abs(p.alpha)})`;
            bgCtx.fill();

            p.y -= p.speed;
            if(p.y < 0) p.y = bgCanvas.height;
        });
        requestAnimationFrame(drawBg);
    }
    drawBg();

    // 跑馬燈
    const mockWinners = [
        "VIP 貴賓 8***6 剛剛刮中了 特等獎！",
        "VIP 貴賓 3***9 剛剛刮中了 尊榮好禮！",
        "VIP 貴賓 5***1 剛剛刮中了 專屬禮券！",
        "VIP 貴賓 1***8 剛剛刮中了 幸運大獎！"
    ];
    let tickerIdx = 0;
    setInterval(() => {
        tickerIdx = (tickerIdx + 1) % mockWinners.length;
        document.getElementById('tickerMsg').innerText = mockWinners[tickerIdx];
    }, 4000);

    // API 邏輯
    const JSONBIN_API_KEY = "$2a$10$92XGHP.lNCPqYGVXwVe1OO1/L4jOoI01kKN4TNQwrALhIOuj8tWwy";
    const JSONBIN_BIN_ID = "6a89842df5f4af5e2934e74f";

    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            return await res.json() || {};
        } catch (e) {
            console.error("載入失敗:", e);
            return {};
        }
    }

    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();
        if (!inputKey) return alert('請輸入金鑰！');

        const btn = document.getElementById('loginBtn');
        btn.innerText = "尊榮金鑰驗證中...";
        btn.disabled = true;

        const db = await loadDB();
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "兌 換 尊 榮 好 禮";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];
        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('bottomCard').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    // 刮刮卡繪製
    let ctx, isDrawing = false, count = 0, isTriggeredConfetti = false;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        const grad = ctx.createLinearGradient(0, 0, 280, 140);
        grad.addColorStop(0, '#d4af37');
        grad.addColorStop(0.3, '#fff3a1');
        grad.addColorStop(0.7, '#8a6109');
        grad.addColorStop(1, '#ffe066');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 280, 140);

        for(let i=0; i<120; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.6})`;
            ctx.fillRect(Math.random()*280, Math.random()*140, 2, 2);
        }
        
        ctx.fillStyle = '#120900';
        ctx.font = '900 15px "Noto Serif TC"';
        ctx.textAlign = 'center';
        ctx.fillText('❖ 刮開圖層 領取好禮 ❖', 140, 75);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 20 && !isTriggeredConfetti) {
                isTriggeredConfetti = true;
                canvas.style.opacity = '0';
                
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ffe066', '#d4af37', '#ffffff']
                });
            }
        };
    }
</script>
</body>
</html>
