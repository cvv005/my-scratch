<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大專屬刮刮樂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }

        body { 
            background: #06040a;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* 粒子背景 canvas */
        #bgCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* 主卡片：黑金奢華重量感 */
        .card-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 440px;
            background: linear-gradient(145deg, #1d162b 0%, #0e0918 100%);
            border-radius: 28px;
            padding: 42px 32px;
            border: 2px solid #e0aa3e;
            box-shadow: 
                0 0 35px rgba(224, 170, 62, 0.25),
                0 25px 60px rgba(0, 0, 0, 0.9),
                inset 0 1px 2px rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        /* 主題 Icon 區塊：立體金幣與牛頭圖騰組合 */
        .hero-icon-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: radial-gradient(circle, #fcee21 0%, #000000 100%);
            padding: 2px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(234, 175, 40, 0.6);
        }

        .hero-icon-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c1f08 0%, #0a0601 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-icon-inner i {
            font-size: 42px;
            background: linear-gradient(180deg, #fff3a1 0%, #e0aa3e 60%, #9e6d0f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
        }

        /* 標題設計 */
        .title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 0%, #ffe899 50%, #e0aa3e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        .subtitle {
            color: #a29bb3;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 28px;
        }

        /* 輸入框樣式 */
        .custom-input {
            background: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid #73541b !important;
            color: #ffe899 !important;
            font-weight: 700;
            font-size: 16px;
            border-radius: 14px;
            padding: 15px;
            transition: all 0.3s;
        }

        .custom-input:focus {
            border-color: #e0aa3e !important;
            box-shadow: 0 0 18px rgba(224, 170, 62, 0.4) !important;
            outline: none;
        }

        .custom-input::placeholder {
            color: #5c5369 !important;
            font-weight: 400;
        }

        /* 金屬立體按鈕 */
        .btn-gold {
            background: linear-gradient(180deg, #ffe066 0%, #e0aa3e 50%, #b37e14 100%);
            border: none;
            color: #1a0f00;
            font-weight: 900;
            font-size: 17px;
            letter-spacing: 2px;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(224, 170, 62, 0.35);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(224, 170, 62, 0.55);
            background: linear-gradient(180deg, #fff0a3 0%, #f5be42 50%, #c98e1a 100%);
        }

        .btn-gold:active {
            transform: translateY(1px);
        }

        /* 刮刮卡區域 */
        .scratch-container { 
            position: relative; 
            width: 300px; 
            height: 150px; 
            margin: 15px auto 0; 
            display: none; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 2px solid #e0aa3e;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .prize-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #2a1836 0%, #0e0714 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        canvas#scratchCanvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: crosshair; 
            transition: opacity 0.5s ease; 
        }
    </style>
</head>
<body>

<!-- 動態背景粒子 -->
<canvas id="bgCanvas"></canvas>

<div class="card-container">
    <!-- 主題標誌：金牛與牛角元素 -->
    <div class="hero-icon-box">
        <div class="hero-icon-inner">
            <i class="fa-solid fa-bullhorn"></i> <!-- 如果要改圖案，這裡可換 Icon -->
        </div>
    </div>

    <div class="title">牛老大專屬刮刮樂</div>
    <div class="subtitle">請輸入專屬金鑰以兌換尊榮獎項</div>

    <div id="loginForm">
        <input type="text" id="keyInput" class="form-control custom-input mb-3 text-center" placeholder="請輸入兌換金鑰">
        <button class="btn btn-gold w-100" id="loginBtn" onclick="handleLogin()">兌 換 尊 榮 好 禮</button>
    </div>

    <div id="scratchSection">
        <div class="scratch-container" id="scratchContainer">
            <div class="prize-layer">
                <i class="fa-solid fa-coins mb-1" style="color: #ffe066; font-size: 26px;"></i>
                <div style="color: #a29bb3; font-size: 11px; letter-spacing: 2px;">恭喜獲得尊榮獎項</div>
                <div id="prizeResult" style="font-size: 24px; font-weight: 900; margin-top: 4px; color: #ffe066;"></div>
            </div>
            <canvas id="scratchCanvas" width="300" height="150"></canvas>
        </div>
        <p id="scratchHint" style="display: none; color: #ffe066; font-size: 13px; margin-top: 12px; font-weight: bold;">
            ✨ 請用手指或滑鼠刮開塗層 ✨
        </p>
    </div>
</div>

<script>
    // 背景金光粒子效果
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];

    function resizeBg() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    for(let i=0; i<50; i++) {
        particles.push({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            r: Math.random() * 2 + 0.5,
            alpha: Math.random(),
            speed: Math.random() * 0.5 + 0.2
        });
    }

    function drawBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        particles.forEach(p => {
            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            bgCtx.fillStyle = `rgba(224, 170, 62, ${p.alpha})`;
            bgCtx.fill();
            p.y -= p.speed;
            if(p.y < 0) p.y = bgCanvas.height;
        });
        requestAnimationFrame(drawBg);
    }
    drawBg();

    // 業務邏輯 API
    const JSONBIN_API_KEY = "$2a$10$92XGHP.lNCPqYGVXwVe1OO1/L4jOoI01kKN4TNQwrALhIOuj8tWwy";
    const JSONBIN_BIN_ID = "6a89842df5f4af5e2934e74f";

    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            return await res.json() || {};
        } catch (e) {
            console.error("載入失敗:", e);
            return {};
        }
    }

    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();
        if (!inputKey) return alert('請輸入金鑰！');

        const btn = document.getElementById('loginBtn');
        btn.innerText = "驗證金鑰中...";
        btn.disabled = true;

        const db = await loadDB();
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "兌 換 尊 榮 好 禮";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];
        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    let ctx, isDrawing = false, count = 0;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        const grad = ctx.createLinearGradient(0, 0, 300, 150);
        grad.addColorStop(0, '#e0aa3e');
        grad.addColorStop(0.5, '#9e6d0f');
        grad.addColorStop(1, '#ffe066');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 300, 150);
        
        ctx.fillStyle = '#1a0f00';
        ctx.font = 'bold 16px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.fillText('🎁 刮開圖層 領取好禮 🎁', 150, 82);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 25) canvas.style.opacity = '0';
        };
    }
</script>
</body>
</html>
