<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>牛老大專屬刮刮樂 - VIP尊榮限定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold-light: #fff3a1;
            --gold-main: #e0aa3e;
            --gold-dark: #8c5d0a;
        }

        * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }

        body { 
            background: 
                repeating-linear-gradient(
                    45deg,
                    rgba(224, 170, 62, 0.02) 0px,
                    rgba(224, 170, 62, 0.02) 1px,
                    transparent 1px,
                    transparent 10px
                ),
                radial-gradient(circle at 50% 45%, rgba(138, 93, 14, 0.35) 0%, rgba(38, 16, 56, 0.8) 50%, #06030a 100%);
            background-attachment: fixed;
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            padding: 20px 0;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景旋轉光束 */
        .bg-rays {
            position: absolute;
            width: 160vw;
            height: 160vw;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(224, 170, 62, 0.05) 15deg,
                transparent 30deg,
                rgba(224, 170, 62, 0.05) 45deg,
                transparent 60deg,
                rgba(224, 170, 62, 0.05) 75deg,
                transparent 90deg,
                rgba(224, 170, 62, 0.05) 105deg,
                transparent 120deg
            );
            border-radius: 50%;
            animation: rotateRays 40s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotateRays {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #bgCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 頂部即時跑馬燈 */
        .live-ticker {
            position: absolute;
            top: 18px;
            z-index: 10;
            background: rgba(224, 170, 62, 0.15);
            border: 1px solid rgba(224, 170, 62, 0.4);
            border-radius: 30px;
            padding: 6px 18px;
            font-size: 12px;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .ticker-dot {
            width: 7px; height: 7px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: blink 1.5s infinite alternate;
        }

        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 核心修改：指定 9:16 直立卡片尺寸 */
        .card-wrapper {
            position: relative;
            width: 360px;          /* 精準 9:16 寬度 */
            height: 640px;         /* 精準 9:16 高度 */
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 28px;
            padding: 2px;
            overflow: hidden;
            box-shadow: 
                0 0 70px rgba(224, 170, 62, 0.3),
                0 30px 90px rgba(0, 0, 0, 0.95);
            z-index: 1;
            margin-top: 15px;
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(
                transparent, 
                rgba(255, 243, 161, 0.35), 
                var(--gold-main), 
                transparent 45%
            );
            animation: rotateStreamer 7s linear infinite;
        }

        @keyframes rotateStreamer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 主體黑金卡片 */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(155deg, #1f1430 0%, #0d0718 100%);
            border-radius: 26px;
            padding: 35px 24px 30px;
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 均勻拉開上下內容，滿版佈局 */
            align-items: center;
        }

        /* 雕花四角裝飾 */
        .corner-pattern {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid var(--gold-main);
            opacity: 0.6;
            pointer-events: none;
        }
        .corner-tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
        .corner-tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
        .corner-br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

        .vip-tag {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--gold-main);
            border: 1px solid rgba(224, 170, 62, 0.4);
            border-radius: 20px;
            padding: 4px 16px;
            display: inline-block;
            background: rgba(224, 170, 62, 0.1);
            box-shadow: inset 0 0 10px rgba(224, 170, 62, 0.25);
            margin-bottom: 10px;
        }

        /* 徽章放大立體感 */
        .badge-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-glow {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(224, 170, 62, 0.6) 0%, transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.25); opacity: 1; }
        }

        .badge-body {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #33240b 0%, #080401 100%);
            border: 2px solid var(--gold-main);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 0 15px rgba(224, 170, 62, 0.5),
                0 8px 25px rgba(0,0,0,0.8);
        }

        .badge-body i {
            font-size: 42px;
            background: linear-gradient(180deg, #FFF3A1 0%, #E0AA3E 60%, #8C5D0A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.9));
        }

        /* 標題區域 */
        .title-area {
            margin-bottom: 20px;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, #ffe899 40%, var(--gold-main) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.6);
        }

        .subtitle {
            color: #9d96b0;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* 輸入框與按鈕區 */
        .form-area {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .custom-input {
            background: rgba(6, 3, 10, 0.8) !important;
            border: 1px solid rgba(224, 170, 62, 0.4) !important;
            color: var(--gold-light) !important;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            border-color: var(--gold-main) !important;
            box-shadow: 0 0 20px rgba(224, 170, 62, 0.4) !important;
            outline: none;
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.3) !important;
            font-weight: 400;
            font-size: 13px;
        }

        .btn-gold {
            position: relative;
            background: linear-gradient(180deg, #ffe066 0%, #e0aa3e 50%, #b37e14 100%);
            border: none;
            color: #140b00;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 2px;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(224, 170, 62, 0.35);
            transition: all 0.25s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .btn-gold::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 50%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: rotate(30deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -60%; }
            30% { left: 140%; }
            100% { left: 140%; }
        }

        /* 刮刮卡區域 */
        .scratch-container { 
            position: relative; 
            width: 280px; 
            height: 150px; 
            margin: 10px auto 0; 
            display: none; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 2px solid var(--gold-main);
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
        }

        .prize-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #331d45 0%, #0d0617 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        canvas#scratchCanvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: crosshair; 
            transition: opacity 0.6s ease; 
        }

        .footer-note {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
</head>
<body>

<!-- 背景旋轉光束 -->
<div class="bg-rays"></div>

<!-- 動態星芒 Canvas -->
<canvas id="bgCanvas"></canvas>

<!-- 頂部跑馬燈 -->
<div class="live-ticker">
    <div class="ticker-dot"></div>
    <span id="tickerMsg">VIP 貴賓 ***9 號 剛剛刮中了 豪華獎項！</span>
</div>

<!-- 9:16 直立卡片 -->
<div class="card-wrapper">
    <div class="card-inner">
        <div class="corner-pattern corner-tl"></div>
        <div class="corner-pattern corner-tr"></div>
        <div class="corner-pattern corner-bl"></div>
        <div class="corner-pattern corner-br"></div>

        <!-- 頂部區塊 -->
        <div>
            <div class="vip-tag">VIP LIMITED EDITION</div>

            <div class="badge-wrap">
                <div class="badge-glow"></div>
                <div class="badge-body">
                    <i class="fa-solid fa-crown"></i>
                </div>
            </div>

            <div class="title-area">
                <div class="title">牛老大專屬刮刮樂</div>
                <div class="subtitle">請輸入專屬金鑰以兌換尊榮禮遇</div>
            </div>
        </div>

        <!-- 中間輸入表單區塊 -->
        <div class="form-area" id="loginForm">
            <input type="text" id="keyInput" class="form-control custom-input mb-3 text-center" placeholder="請輸入兌換金鑰">
            <button class="btn btn-gold w-100" id="loginBtn" onclick="handleLogin()">兌 換 尊 榮 好 禮</button>
        </div>

        <!-- 刮刮樂解鎖區域 -->
        <div id="scratchSection" style="margin-bottom: 10px;">
            <div class="scratch-container" id="scratchContainer">
                <div class="prize-layer">
                    <i class="fa-solid fa-gem mb-1" style="color: var(--gold-light); font-size: 28px; filter: drop-shadow(0 2px 10px rgba(224,170,62,0.8));"></i>
                    <div style="color: #9d96b0; font-size: 11px; letter-spacing: 2px;">❖ 恭喜獲得尊榮獎項 ❖</div>
                    <div id="prizeResult" style="font-size: 22px; font-weight: 900; margin-top: 4px; color: var(--gold-light);"></div>
                </div>
                <canvas id="scratchCanvas" width="280" height="150"></canvas>
            </div>
            <p id="scratchHint" style="display: none; color: var(--gold-light); font-size: 12.5px; margin-top: 12px; font-weight: bold; letter-spacing: 1px;">
                ✨ 請滑動刮開金色塗層 ✨
            </p>
        </div>

    </div>
</div>

<div class="footer-note">❖ 牛老大 VIP 尊榮邀請禮遇 ❖</div>

<script>
    // 星芒繪製
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];

    function resizeBg() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    for(let i=0; i<70; i++) {
        particles.push({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            size: Math.random() * 3 + 1,
            alpha: Math.random(),
            speed: Math.random() * 0.2 + 0.05,
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            isSparkle: Math.random() > 0.6
        });
    }

    function drawSparkle(x, y, size, alpha) {
        bgCtx.strokeStyle = `rgba(255, 243, 161, ${alpha})`;
        bgCtx.lineWidth = 0.8;
        bgCtx.beginPath();
        bgCtx.moveTo(x - size * 3, y);
        bgCtx.lineTo(x + size * 3, y);
        bgCtx.moveTo(x, y - size * 3);
        bgCtx.lineTo(x, y + size * 3);
        bgCtx.stroke();
    }

    function drawBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        particles.forEach(p => {
            p.alpha += p.twinkleSpeed;
            if (p.alpha > 1 || p.alpha < 0) p.twinkleSpeed = -p.twinkleSpeed;

            const currentAlpha = Math.abs(p.alpha);

            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI*2);
            bgCtx.fillStyle = `rgba(224, 170, 62, ${currentAlpha})`;
            bgCtx.fill();

            if (p.isSparkle && currentAlpha > 0.4) {
                drawSparkle(p.x, p.y, p.size, currentAlpha);
            }

            p.y -= p.speed;
            if(p.y < 0) p.y = bgCanvas.height;
        });
        requestAnimationFrame(drawBg);
    }
    drawBg();

    // 跑馬燈
    const mockWinners = [
        "VIP 貴賓 8***6 剛剛刮中了 特等獎！",
        "VIP 貴賓 3***9 剛剛刮中了 尊榮好禮！",
        "VIP 貴賓 5***1 剛剛刮中了 專屬禮券！",
        "VIP 貴賓 1***8 剛剛刮中了 幸運大獎！"
    ];
    let tickerIdx = 0;
    setInterval(() => {
        tickerIdx = (tickerIdx + 1) % mockWinners.length;
        document.getElementById('tickerMsg').innerText = mockWinners[tickerIdx];
    }, 4000);

    // API 邏輯
    const JSONBIN_API_KEY = "$2a$10$92XGHP.lNCPqYGVXwVe1OO1/L4jOoI01kKN4TNQwrALhIOuj8tWwy";
    const JSONBIN_BIN_ID = "6a89842df5f4af5e2934e74f";

    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            return await res.json() || {};
        } catch (e) {
            console.error("載入失敗:", e);
            return {};
        }
    }

    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();
        if (!inputKey) return alert('請輸入金鑰！');

        const btn = document.getElementById('loginBtn');
        btn.innerText = "尊榮金鑰驗證中...";
        btn.disabled = true;

        const db = await loadDB();
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "兌 換 尊 榮 好 禮";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];
        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    // 刮刮卡邏輯
    let ctx, isDrawing = false, count = 0, isTriggeredConfetti = false;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        const grad = ctx.createLinearGradient(0, 0, 280, 150);
        grad.addColorStop(0, '#e0aa3e');
        grad.addColorStop(0.3, '#fff3a1');
        grad.addColorStop(0.7, '#9e6d0f');
        grad.addColorStop(1, '#ffe066');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 280, 150);

        for(let i=0; i<120; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
            ctx.fillRect(Math.random()*280, Math.random()*150, 2, 2);
        }
        
        ctx.fillStyle = '#140b00';
        ctx.font = 'bold 15px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.fillText('❖ 刮開圖層 領取好禮 ❖', 140, 80);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 20 && !isTriggeredConfetti) {
                isTriggeredConfetti = true;
                canvas.style.opacity = '0';
                
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ffe066', '#e0aa3e', '#ffffff']
                });
            }
        };
    }
</script>
</body>
</html>
