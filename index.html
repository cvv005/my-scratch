<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大專屬刮刮樂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-light: #ffe57f;
            --gold-main: #ffc107;
            --gold-dark: #ff8f00;
            --bg-gradient: radial-gradient(circle at center, #1a102f 0%, #080511 100%);
        }

        * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }

        body { 
            background: var(--bg-gradient);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* 奢華金屬動態微光 */
        .glow-aura {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.18) 0%, rgba(255, 143, 0, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseAura 4s ease-in-out infinite alternate;
        }

        @keyframes pulseAura {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* 尊榮主卡片 */
        .boss-card { 
            width: 90%; 
            max-width: 420px; 
            padding: 45px 32px; 
            border-radius: 28px; 
            background: rgba(23, 17, 40, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(255, 193, 7, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
            text-align: center; 
            position: relative;
            z-index: 1;
        }

        /* 鍍金皇冠勳章 */
        .crown-badge {
            width: 85px;
            height: 85px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.25) 0%, rgba(0, 0, 0, 0.4) 100%);
            border: 2px solid var(--gold-main);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 25px rgba(255, 193, 7, 0.4),
                inset 0 0 15px rgba(255, 193, 7, 0.3);
            animation: floatBadge 3s ease-in-out infinite alternate;
        }

        @keyframes floatBadge {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        .crown-badge i {
            font-size: 40px;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 40%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(255, 193, 7, 0.6));
        }

        /* 標題與內文 */
        .title {
            background: linear-gradient(135deg, #ffffff 0%, #ffecb3 50%, var(--gold-main) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.65);
            font-size: 13.5px;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }

        /* 輸入框 */
        .custom-input {
            background: rgba(12, 8, 24, 0.7) !important;
            border: 1px solid rgba(255, 193, 7, 0.35) !important;
            color: #ffffff !important;
            font-weight: bold;
            font-size: 15px;
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s ease;
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.3) !important;
            font-weight: normal;
        }

        .custom-input:focus {
            border-color: var(--gold-main) !important;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.35) !important;
        }

        /* 奢華金屬按鈕 */
        .btn-gold {
            background: linear-gradient(135deg, #ffc107 0%, #ff8f00 50%, #c77700 100%);
            border: none;
            color: #120a00;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1.5px;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 8px 25px rgba(255, 143, 0, 0.4);
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #ffe082 0%, #ffb300 100%);
            box-shadow: 0 10px 30px rgba(255, 193, 7, 0.6);
            transform: translateY(-2px);
            color: #000000;
        }

        /* 刮刮卡區域 */
        .scratch-container { 
            position: relative; 
            width: 290px; 
            height: 145px; 
            margin: 20px auto; 
            display: none; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 2px solid var(--gold-main);
            box-shadow: 0 0 30px rgba(255, 193, 7, 0.45);
        }

        .prize-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #2a1b40 0%, #0f0a1c 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            color: var(--gold-light); 
        }

        canvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: crosshair; 
            transition: opacity 0.5s ease; 
        }
    </style>
</head>
<body>

<div class="glow-aura"></div>

<div class="boss-card">
    <!-- 金屬立體皇冠 -->
    <div class="crown-badge">
        <i class="fa-solid fa-crown"></i>
    </div>

    <h3 class="title">牛老大專屬刮刮樂</h3>
    <p class="subtitle">輸入專屬金鑰即可領取尊榮獎項</p>
    
    <div id="loginForm">
        <input type="text" id="keyInput" class="form-control custom-input mb-3 text-center" placeholder="請輸入兌換金鑰">
        <button class="btn btn-gold w-100" id="loginBtn" onclick="handleLogin()">兌 換 尊 榮 好 禮</button>
    </div>

    <div id="scratchSection">
        <div class="scratch-container" id="scratchContainer">
            <div class="prize-layer">
                <div style="color: rgba(255, 255, 255, 0.6); font-size: 12px; letter-spacing: 2px;">❖ 恭喜獲得獎項 ❖</div>
                <div id="prizeResult" style="font-size: 26px; margin-top: 6px; color: var(--gold-light);"></div>
            </div>
            <canvas id="scratchCanvas" width="290" height="145"></canvas>
        </div>
        <p id="scratchHint" class="text-warning small mt-2 fw-bold" style="display: none;">✨ 請滑動刮開金色塗層 ✨</p>
    </div>
</div>

<script>
    const JSONBIN_API_KEY = "$2a$10$92XGHP.lNCPqYGVXwVe1OO1/L4jOoI01kKN4TNQwrALhIOuj8tWwy";
    const JSONBIN_BIN_ID = "6a89842df5f4af5e2934e74f";

    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            const data = await res.json();
            return (data && typeof data === 'object') ? data : {};
        } catch (e) {
            console.error("雲端載入失敗:", e);
            return {};
        }
    }

    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("雲端同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();
        if (!inputKey) return alert('請輸入金鑰！');

        const btn = document.getElementById('loginBtn');
        btn.innerText = "驗證中...";
        btn.disabled = true;

        const db = await loadDB();
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "兌 換 尊 榮 好 禮";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];
        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    let ctx, isDrawing = false, count = 0;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        const grad = ctx.createLinearGradient(0, 0, 290, 145);
        grad.addColorStop(0, '#ffc107');
        grad.addColorStop(0.5, '#ff8f00');
        grad.addColorStop(1, '#ffe57f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 290, 145);
        
        ctx.fillStyle = '#120a00';
        ctx.font = 'bold 15px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.fillText('✨ 滑動刮開圖層 ✨', 145, 78);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 25) canvas.style.opacity = '0';
        };
    }
</script>
</body>
</html>
