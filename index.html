<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>埃及神祇・命運刮刮樂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --egypt-gold: #ffd700;
            --egypt-purple: #9b51e0;
            --egypt-blue: #00d2ff;
        }

        * { font-family: 'Noto Sans TC', sans-serif; }

        body { 
            background: #0b0712;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            color: #ffffff;
            position: relative;
        }

        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            transition: background-image 0.5s ease;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        .egypt-card { 
            width: 90%; 
            max-width: 460px; 
            padding: 35px 25px; 
            border-radius: 20px; 
            background: rgba(12, 8, 20, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid var(--egypt-gold);
            box-shadow: 
                0 0 25px rgba(255, 215, 0, 0.4),
                inset 0 0 15px rgba(155, 81, 224, 0.3);
            text-align: center; 
            position: relative;
            z-index: 1;
        }

        .egypt-title {
            color: var(--egypt-gold);
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 0 12px var(--egypt-gold), 0 0 20px var(--egypt-purple);
            letter-spacing: 2px;
        }

        .egypt-input {
            background: rgba(10, 5, 20, 0.85) !important;
            border: 1px solid var(--egypt-gold) !important;
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: inset 0 0 8px rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
        }

        .egypt-input::placeholder {
            color: rgba(255, 215, 0, 0.6) !important;
            font-size: 14px;
        }

        .egypt-input:focus {
            border-color: var(--egypt-blue) !important;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6) !important;
        }

        .btn-egypt {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border: none;
            color: #1a0033;
            font-weight: 900;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            transition: all 0.3s ease;
        }

        .btn-egypt:hover {
            background: linear-gradient(135deg, #ffffff, #ffd700);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            transform: translateY(-2px);
            color: #000;
        }

        .scratch-container { 
            position: relative; 
            width: 300px; 
            height: 150px; 
            margin: 20px auto; 
            display: none; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid var(--egypt-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .prize-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #2a085c 0%, #0d001a 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            color: var(--egypt-gold); 
            text-shadow: 0 0 10px var(--egypt-gold);
        }

        canvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: crosshair; 
            transition: opacity 0.5s ease; 
        }

        .list-group-item {
            background: rgba(15, 5, 25, 0.8) !important;
            border-color: rgba(255, 215, 0, 0.2) !important;
            color: #ffffff !important;
            font-size: 13px;
        }

        .badge-used { color: #ff4d4d; font-weight: bold; }
        .badge-active { color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

<div id="bgLayer" class="bg-layer"></div>

<div class="egypt-card">
    
    <!-- 1. 金鑰輸入驗證頁面 -->
    <div id="loginPage">
        <h3 class="egypt-title mb-3">𓋹 埃及神祇・刮刮樂 𓋹</h3>
        
        <div id="loginForm">
            <p class="text-warning small mb-3">請輸入您的神聖金鑰以開啟獎項：</p>
            
            <input type="text" id="keyInput" class="form-control egypt-input mb-3 text-center fw-bold" placeholder="請輸入專屬金鑰" style="letter-spacing: 2px;">
            
            <button class="btn btn-egypt w-100 py-2.5 rounded-pill" id="loginBtn" onclick="handleLogin()">開啟神聖契約</button>
        </div>

        <div id="scratchSection">
            <div class="scratch-container" id="scratchContainer">
                <div class="prize-layer">
                    <div style="color: var(--egypt-blue); font-size: 13px; letter-spacing: 2px;">❖ 恭喜獲得獎項 ❖</div>
                    <div id="prizeResult" style="font-size: 26px; margin-top: 5px;"></div>
                </div>
                <canvas id="scratchCanvas" width="300" height="150"></canvas>
            </div>
            <p id="scratchHint" class="text-warning small mt-2 fw-bold" style="display: none;">✨ 請滑動塗抹刮開塗層 ✨</p>
        </div>
    </div>

    <!-- 2. 管理員控制台 -->
    <div id="adminPage" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="egypt-title mb-0" style="font-size: 18px;">⚙️ 雲端主機控制台</h4>
            <button class="btn btn-outline-warning btn-sm rounded-pill" onclick="logoutAdmin()">登出</button>
        </div>

        <div class="card p-3 mb-3 text-start border-0" style="background: rgba(255, 215, 0, 0.05); border: 1px solid var(--egypt-gold) !important;">
            <h6 class="text-warning fw-bold mb-2">🔑 手動新增額外授權金鑰：</h6>
            <input type="text" id="customKeyInput" class="form-control egypt-input mb-2" placeholder="設定金鑰 (如: VIP888)">
            <input type="text" id="prizeInput" class="form-control egypt-input mb-3" placeholder="設定金額 (如：$500)">
            
            <button class="btn btn-egypt w-100 fw-bold rounded-3" id="genBtn" onclick="generateSubAccount()">同步至雲端</button>
        </div>

        <div class="text-start">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="text-warning fw-bold mb-0">雲端 131 組授權紀錄：</h6>
                <button class="btn btn-link btn-sm text-danger p-0 text-decoration-none" onclick="clearAllData()">重置雲端資料庫</button>
            </div>
            <div style="max-height: 200px; overflow-y: auto;">
                <ul id="keyList" class="list-group list-group-flush"></ul>
            </div>
        </div>

        <button class="btn btn-outline-light w-100 mt-3 rounded-pill" onclick="logoutAdmin()">登出管理員</button>
    </div>

</div>

        "A091-271": { prize: "$720", isUsed: false }, "A092-630": { prize: "$138", isUsed: false }, "A093-104": { prize: "$450", isUsed: false }, "A094-859": { prize: "$830", isUsed: false }, "A095-320": { prize: "$260", isUsed: false },
        "A096-741": { prize: "$610", isUsed: false }, "A097-192": { prize: "$380", isUsed: false }, "A098-803": { prize: "$790", isUsed: false }, "A099-420": { prize: "$168", isUsed: false }, "A100-981": { prize: "$888", isUsed: false }
    };

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('bgLayer').style.backgroundImage = `url('${DEFAULT_BG}')`;
        
        if (localStorage.getItem('isAdminLoggedIn') === 'true') {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            updateKeyList();
        }
    });

    // 讀取 JSONBin 資料庫 (若空則自動注入 131 組預設金鑰)
    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            const data = await res.json();
            if (!data || Object.keys(data).length === 0) {
                await saveDB(DEFAULT_KEYS);
                return DEFAULT_KEYS;
            }
            return data;
        } catch (e) {
            console.error("雲端載入失敗:", e);
            return DEFAULT_KEYS;
        }
    }

    // 寫入 JSONBin 資料庫
    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("雲端同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();

        if (!inputKey) return alert('請輸入金鑰！');

        // 管理員驗證 (金鑰：cvv005)
        if (inputKey === ADMIN_KEY) {
            localStorage.setItem('isAdminLoggedIn', 'true');
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            document.getElementById('keyInput').value = '';
            updateKeyList();
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.innerText = "連線雲端驗證中...";
        btn.disabled = true;

        const db = await loadDB();
        
        // 不區分大小寫比對金鑰
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "開啟神聖契約";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];

        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    async function generateSubAccount() {
        const customKey = document.getElementById('customKeyInput').value.trim();
        const prize = document.getElementById('prizeInput').value.trim();

        if (!customKey || !prize) return alert('請填寫金鑰與金額！');

        const btn = document.getElementById('genBtn');
        btn.innerText = "跨裝置同步中...";
        btn.disabled = true;

        const db = await loadDB();

        db[customKey] = {
            prize: prize,
            isUsed: false
        };

        await saveDB(db);

        btn.innerText = "同步至雲端";
        btn.disabled = false;

        alert(`✅ 授權成功！\n\n金鑰：${customKey}\n金額：${prize}`);

        document.getElementById('customKeyInput').value = '';
        document.getElementById('prizeInput').value = '';
        updateKeyList();
    }

    async function updateKeyList() {
        const list = document.getElementById('keyList');
        list.innerHTML = '<li class="list-group-item text-muted text-center">連線雲端資料庫中...</li>';
        
        const db = await loadDB();
        list.innerHTML = '';
        
        const keys = Object.keys(db);
        
        if (keys.length === 0) {
            list.innerHTML = '<li class="list-group-item text-muted text-center">目前無任何雲端紀錄</li>';
            return;
        }

        for (let k of keys) {
            const item = db[k];
            const status = item.isUsed 
                ? '<span class="badge-used">[已刮開]</span>' 
                : '<span class="badge-active">[可使用]</span>';
            list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center py-1.5">
                <div>
                    <b>金鑰:</b> <span class="text-warning">${k}</span> (${item.prize}) ${status}
                </div>
                <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteItem('${k}')">刪除</button>
            </li>`;
        }
    }

    async function deleteItem(key) {
        if (confirm(`確定要刪除金鑰 [${key}] 嗎？`)) {
            const db = await loadDB();
            delete db[key];
            await saveDB(db);
            updateKeyList();
        }
    }

    async function clearAllData() {
        if (confirm('確定要將雲端資料庫重置為預設的 131 組金鑰？')) {
            await saveDB(DEFAULT_KEYS);
            updateKeyList();
        }
    }

    function logoutAdmin() {
        localStorage.removeItem('isAdminLoggedIn');
        document.getElementById('adminPage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'block';
        document.getElementById('keyInput').value = '';
    }

    let ctx, isDrawing = false, count = 0;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        const grad = ctx.createLinearGradient(0, 0, 300, 150);
        grad.addColorStop(0, '#b8860b');
        grad.addColorStop(0.5, '#4a0e4e');
        grad.addColorStop(1, '#ffd700');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 300, 150);
        
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.strokeRect(5, 5, 290, 140);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 8;
        ctx.fillText('✨ 滑動刮開金屬圖層 ✨', 150, 80);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 30) canvas.style.opacity = '0';
        };
    }
</script>
</body>
</html>
