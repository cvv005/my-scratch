<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛老大專屬刮刮樂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #f39c12;
            --gold-light: #f1c40f;
            --bg-dark: #0f0c20;
        }

        * { font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; }

        body { 
            background: #090714;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* 絢麗深色微光背景 */
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.15) 0%, rgba(142, 68, 173, 0.1) 40%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulse 6s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* 玻璃擬態主卡片 */
        .card-box { 
            width: 90%; 
            max-width: 420px; 
            padding: 40px 30px; 
            border-radius: 28px; 
            background: rgba(22, 19, 43, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center; 
            position: relative;
            z-index: 1;
        }

        /* 質感 Emoji 標誌圈 */
        .icon-badge {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.2), rgba(241, 196, 15, 0.05));
            border: 1.5px solid rgba(243, 156, 18, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.3);
        }

        .title {
            background: linear-gradient(135deg, #ffffff 0%, #ffeaa7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a0a5ba;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* 現代輸入框 */
        .custom-input {
            background: rgba(10, 8, 20, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #ffffff !important;
            font-weight: bold;
            font-size: 15px;
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s ease;
        }

        .custom-input::placeholder {
            color: #636b83 !important;
            font-weight: normal;
        }

        .custom-input:focus {
            border-color: var(--gold-primary) !important;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.3) !important;
        }

        /* 奢華漸層按鈕 */
        .btn-gold {
            background: linear-gradient(135deg, #f39c12 0%, #d35400 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.3);
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #f1c40f 0%, #e67e22 100%);
            box-shadow: 0 12px 30px rgba(243, 156, 18, 0.5);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* 刮刮區塊 */
        .scratch-container { 
            position: relative; 
            width: 280px; 
            height: 140px; 
            margin: 20px auto; 
            display: none; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.4);
        }

        .prize-layer { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #2c1a32 0%, #0f0c20 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            color: var(--gold-light); 
        }

        canvas { 
            position: absolute; 
            top: 0; left: 0; 
            cursor: crosshair; 
            transition: opacity 0.5s ease; 
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="card-box">
    <!-- 純霸氣牛頭 Emoji，絕不破圖 -->
    <div class="icon-badge">🐂</div>

    <h3 class="title">牛老大專屬刮刮樂</h3>
    <p class="subtitle">輸入專屬金鑰即可領取尊榮獎項</p>
    
    <div id="loginForm">
        <input type="text" id="keyInput" class="form-control custom-input mb-3 text-center" placeholder="請輸入兌換金鑰">
        <button class="btn btn-gold w-100" id="loginBtn" onclick="handleLogin()">兌 換 尊 榮 好 禮</button>
    </div>

    <div id="scratchSection">
        <div class="scratch-container" id="scratchContainer">
            <div class="prize-layer">
                <div style="color: #a0a5ba; font-size: 12px; letter-spacing: 2px;">❖ 恭喜獲得獎項 ❖</div>
                <div id="prizeResult" style="font-size: 26px; margin-top: 6px;"></div>
            </div>
            <canvas id="scratchCanvas" width="280" height="140"></canvas>
        </div>
        <p id="scratchHint" class="text-warning small mt-2 fw-bold" style="display: none;">✨ 請滑動刮開塗層 ✨</p>
    </div>
</div>

<script>
    const JSONBIN_API_KEY = "$2a$10$92XGHP.lNCPqYGVXwVe1OO1/L4jOoI01kKN4TNQwrALhIOuj8tWwy";
    const JSONBIN_BIN_ID = "6a89842df5f4af5e2934e74f";

    async function loadDB() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: { 
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Meta': 'false'
                }
            });
            const data = await res.json();
            return (data && typeof data === 'object') ? data : {};
        } catch (e) {
            console.error("雲端載入失敗:", e);
            return {};
        }
    }

    async function saveDB(db) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(db)
            });
            return true;
        } catch (e) {
            console.error("雲端同步失敗:", e);
            return false;
        }
    }

    async function handleLogin() {
        const inputKey = document.getElementById('keyInput').value.trim();
        if (!inputKey) return alert('請輸入金鑰！');

        const btn = document.getElementById('loginBtn');
        btn.innerText = "驗證中...";
        btn.disabled = true;

        const db = await loadDB();
        let matchedKey = Object.keys(db).find(k => k.toLowerCase() === inputKey.toLowerCase());

        btn.innerText = "兌 換 尊 榮 好 禮";
        btn.disabled = false;

        if (!matchedKey) {
            return alert('❌ 金鑰無效！請確認輸入是否正確。');
        }

        const item = db[matchedKey];
        if (item.isUsed) {
            return alert('⚠️ 該金鑰已經使用過！');
        }

        item.isUsed = true;
        await saveDB(db);

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('scratchContainer').style.display = 'block';
        document.getElementById('scratchHint').style.display = 'block';
        document.getElementById('prizeResult').innerText = item.prize;
        
        initCanvas();
    }

    let ctx, isDrawing = false, count = 0;
    function initCanvas() {
        const canvas = document.getElementById('scratchCanvas');
        ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'source-over';
        
        const grad = ctx.createLinearGradient(0, 0, 280, 140);
        grad.addColorStop(0, '#f39c12');
        grad.addColorStop(0.5, '#d35400');
        grad.addColorStop(1, '#f1c40f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 280, 140);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.fillText('✨ 滑動刮開圖層 ✨', 140, 75);

        canvas.onmousedown = canvas.ontouchstart = () => { isDrawing = true; };
        canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fill();
            
            count++;
            if (count > 25) canvas.style.opacity = '0';
        };
    }
</script>
</body>
</html>
